<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBC Pilot & RMT Registry (NA)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1A1C22;
            --border-color: #2D313D;
            --border-subtle: #232732;
            --text-title: #D4B872;
            --text-main: #E5E0D8;
            --text-sub: #8C92A4;
            --badge-bg: #272A34;
            --name-horde: #FF5B52;
            --name-alliance: #4DA1FF;
            --font-serif: 'Cinzel', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            padding: 2.5rem 1.5rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1060px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 1.25rem;
        }

        .shield-icon {
            width: 46px;
            height: 52px;
            background: #2E281E;
            border: 2px solid var(--text-title);
            clip-path: polygon(50% 0%, 100% 15%, 100% 75%, 50% 100%, 0% 75%, 0% 15%);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .shield-icon::after {
            content: "†";
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: var(--text-title);
            font-weight: bold;
        }

        .title-group h1 {
            font-family: var(--font-serif);
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .title-group p {
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .tags-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-subtle);
            padding-top: 1rem;
        }

        .tag-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag-pill {
            background: #14161B;
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
        }

        .tag-pill:hover {
            background: #232732;
            color: var(--text-main);
        }

        .tag-pill.active {
            background: var(--badge-bg);
            border-color: var(--text-title);
            color: var(--text-title);
            font-weight: 700;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        .dot-horde { background: var(--name-horde); }
        .dot-alliance { background: var(--name-alliance); }

        .entry-count-header {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-sub);
        }

        .notice-banner {
            background: #221C16;
            border: 1px dashed #5A4323;
            border-radius: 8px;
            padding: 0.85rem 1.25rem;
            text-align: center;
            color: #D3C3A8;
        }

        .notice-banner strong {
            display: block;
            font-size: 0.88rem;
            margin-bottom: 4px;
        }

        .notice-banner span {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem 1.75rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
        }
